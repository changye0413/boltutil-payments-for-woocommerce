name: Package release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^ \* Version: //p' boltutil-woocommerce.php | head -1)"
          test "$version" = "$declared"
          bash tools/build-release.sh
          unzip -tq "../boltutil-payments-for-woocommerce-${version}.zip"
          sha256sum "../boltutil-payments-for-woocommerce-${version}.zip"
      - name: Publish installable ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "../boltutil-payments-for-woocommerce-${version}.zip" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md --prerelease
